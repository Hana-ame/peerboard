      centerScoreLabel.textContent = state.winner !== 0 ? (state.winReason || '对局结束') : `第 ${state.moveCount + 1} 手`;
    }

    // Mode Buttons
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const m = btn.dataset.mode;
        if (state.mode === m) return;
        destroyPeer();
        state.mode = m;
        document.querySelectorAll('.mode-btn').forEach(b => {
          b.className = b.dataset.mode === m
            ? 'mode-btn px-2 py-1.5 rounded-lg text-xs font-medium transition bg-amber-500 text-slate-950'
            : 'mode-btn px-2 py-1.5 rounded-lg text-xs font-medium transition text-slate-300 hover:text-white';
        });
        document.getElementById('p2pPanel').classList.toggle('hidden', m !== 'p2p');
        setConnStatus('off', m === 'p2p' ? '未连接' : m === 'ai' ? '人机 AI' : '本地双人');
        initGame(state.gameId);
      });
    });

    // Go Size Buttons
    document.querySelectorAll('.go-size-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.goSize = parseInt(btn.dataset.gosize, 10);
        document.querySelectorAll('.go-size-btn').forEach(b => {
          b.className = parseInt(b.dataset.gosize, 10) === state.goSize
            ? 'go-size-btn px-2 py-1 rounded-lg text-xs font-medium bg-amber-500 text-slate-950'
            : 'go-size-btn px-2 py-1 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700';
        });
        initGame('go');
        if (state.mode === 'p2p' && state.connected && state.isHost && state.conn) {
          state.conn.send({ type: 'sync_init', gameId: 'go', goSize: state.goSize });
        }
      });
    });

    document.getElementById('createRoomBtn').addEventListener('click', createRoom);
    leaveRoomBtn.addEventListener('click', () => { destroyPeer(); addLog('已离开房间'); });
    document.getElementById('joinRoomBtn').addEventListener('click', () => joinRoom(joinInput.value));
    joinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoom(joinInput.value); });

    document.getElementById('copyCodeBtn').addEventListener('click', () => {
      if (state.roomId) copyText(state.roomId, '已复制房间号！');
    });
    document.getElementById('copyShareStrBtn').addEventListener('click', () => {
      if (!state.roomId) return;
      const meta = getGameMeta();
      const shareStr = `【棋侠对战】邀请你来一局「${meta.name}」\n房间号：${state.roomId}\n复制整段文字到“加入房间”输入框即可秒进！`;
      copyText(shareStr, '已复制完整分享口令！');
    });

    document.getElementById('soundToggleBtn').addEventListener('click', (e) => {
      state.soundOn = !state.soundOn;
      e.currentTarget.textContent = state.soundOn ? '🔊 音效开' : '🔇 静音';
    });

    passBtn.addEventListener('click', () => {
      if (state.gameId !== 'go' || state.winner !== 0) return;
      if (state.mode === 'p2p' && (!state.connected || state.turn !== state.mySide)) return;
      applyMove({ pass: true });
    });

    scoreGoBtn.addEventListener('click', () => {
      if (state.gameId === 'go' && state.winner === 0) finishGoGame();
    });

    document.getElementById('undoBtn').addEventListener('click', () => {
      if (state.history.length === 0) { showToast('当前没有可悔的步骤'); return; }
      if (state.mode === 'p2p') {
        if (!state.connected || !state.conn) return;
        state.conn.send({ type: 'undo_req' });
        showToast('已向对手发送悔棋请求');
      } else {
        performUndo();
        if (state.mode === 'ai' && state.turn === 2 && state.history.length > 0) performUndo();
      }
    });

    document.getElementById('resignBtn').addEventListener('click', () => {
      if (state.winner !== 0) return;
      const loser = state.mode === 'p2p' ? state.mySide : state.turn;
      state.winner = 3 - loser;
      state.winReason = `${loser === 1 ? getGameMeta().p1 : getGameMeta().p2} 认输`;
      if (state.mode === 'p2p' && state.connected && state.conn) {
        state.conn.send({ type: 'resign' });
      }
      playTone('win');
      updateUI();
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
      if (state.mode === 'p2p' && state.connected && state.conn) {
        state.conn.send({ type: 'restart_req' });
        showToast('已发送重开请求，等待对方确认');
      } else {
        initGame(state.gameId, true);
      }
    });

    document.getElementById('chatForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const txt = chatInput.value.trim();
      if (!txt) return;
      chatInput.value = '';
      addLog(txt, 'me');
      if (state.mode === 'p2p' && state.connected && state.conn) {
        state.conn.send({ type: 'chat', text: txt });
      }
    });

    window.addEventListener('resize', resizeAndDraw);
    window.addEventListener('load', () => {
      setConnStatus('off', '未连接');
      initGame('xiangqi');
    });
  })();
  </script>
</body>
</html>
